<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
<title id="title">Percurso da disciplina de Banco de Dados</title><desc id="desc">Seis etapas ligadas a um projeto central de banco PostgreSQL integrado, seguro e mensurável.</desc>
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#eef4ff"/><stop offset="1" stop-color="#edf9f7"/></linearGradient><linearGradient id="core" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#315efb"/><stop offset="1" stop-color="#16a5a3"/></linearGradient><filter id="shadow"><feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#162033" flood-opacity=".16"/></filter></defs>
<rect width="1600" height="900" rx="42" fill="url(#bg)"/><text x="800" y="78" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="42" font-weight="800" fill="#162033">Percurso da disciplina</text><text x="800" y="122" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="22" fill="#5d6b82">Da interpretação do domínio à defesa de uma solução PostgreSQL</text>
<path d="M350 275 C520 210 620 235 710 345" fill="none" stroke="#91a8ea" stroke-width="5" stroke-dasharray="10 12"/><path d="M1250 275 C1080 210 980 235 890 345" fill="none" stroke="#74c6c2" stroke-width="5" stroke-dasharray="10 12"/><path d="M310 610 C500 685 620 650 710 555" fill="none" stroke="#91a8ea" stroke-width="5" stroke-dasharray="10 12"/><path d="M1290 610 C1100 685 980 650 890 555" fill="none" stroke="#74c6c2" stroke-width="5" stroke-dasharray="10 12"/>
<g filter="url(#shadow)"><rect x="535" y="305" width="530" height="285" rx="40" fill="url(#core)"/><text x="800" y="386" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="25" font-weight="700" fill="#e9efff">Projeto principal</text><text x="800" y="438" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="40" font-weight="850" fill="white">Banco PostgreSQL</text><text x="800" y="487" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="40" font-weight="850" fill="white">integrado e mensurável</text><text x="800" y="535" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="20" fill="#edfafa">modelagem · SQL · integração · desempenho · defesa</text></g>
<g font-family="Inter,Arial,sans-serif">
<g transform="translate(90 190)"><rect width="410" height="175" rx="26" fill="white" stroke="#cad7ff" stroke-width="3"/><text x="34" y="46" font-size="19" font-weight="800" fill="#315efb">01 · FUNDAMENTOS</text><text x="34" y="83" font-size="23" font-weight="750" fill="#162033"><tspan x="34">Dados · SGBD · abstração</tspan><tspan x="34" dy="30">· modelos</tspan></text><text x="34" y="150" font-size="18" fill="#66758b">Compreender o problema antes da tecnologia.</text></g>
<g transform="translate(1100 190)"><rect width="410" height="175" rx="26" fill="white" stroke="#b9e4df" stroke-width="3"/><text x="34" y="46" font-size="19" font-weight="800" fill="#168b8a">02 · MODELAGEM</text><text x="34" y="83" font-size="23" font-weight="750" fill="#162033"><tspan x="34">Relacional · MER · MEER</tspan><tspan x="34" dy="30">· normalização</tspan></text><text x="34" y="150" font-size="18" fill="#66758b">Transformar regras em estruturas consistentes.</text></g>
<g transform="translate(45 560)"><rect width="455" height="175" rx="26" fill="white" stroke="#cad7ff" stroke-width="3"/><text x="34" y="46" font-size="19" font-weight="800" fill="#315efb">03 · SQL E INTEGRIDADE</text><text x="34" y="86" font-size="23" font-weight="750" fill="#162033"><tspan x="34">DDL · DML · consultas</tspan><tspan x="34" dy="30">· restrições</tspan></text><text x="34" y="150" font-size="18" fill="#66758b">Definir, alterar e recuperar dados com precisão.</text></g>
<g transform="translate(1100 560)"><rect width="455" height="175" rx="26" fill="white" stroke="#b9e4df" stroke-width="3"/><text x="34" y="46" font-size="19" font-weight="800" fill="#168b8a">04 · POSTGRESQL E APLICAÇÃO</text><text x="34" y="86" font-size="22" font-weight="750" fill="#162033"><tspan x="34">psql · conexão · parâmetros</tspan><tspan x="34" dy="30">· migrations</tspan></text><text x="34" y="150" font-size="18" fill="#66758b">Integrar o banco ao ciclo de vida do software.</text></g>
<g transform="translate(285 758)"><rect width="490" height="105" rx="24" fill="#edf2ff" stroke="#9eb4ff" stroke-width="3"/><text x="30" y="42" font-size="18" font-weight="800" fill="#315efb">05 · OPERAÇÃO E DESEMPENHO</text><text x="30" y="76" font-size="21" font-weight="700" fill="#162033">Índices · planos · transações · concorrência</text></g>
<g transform="translate(825 758)"><rect width="490" height="105" rx="24" fill="#e9f8f6" stroke="#8bd4cf" stroke-width="3"/><text x="30" y="42" font-size="18" font-weight="800" fill="#168b8a">06 · SEGURANÇA E DEFESA</text><text x="30" y="76" font-size="21" font-weight="700" fill="#162033">Roles · backup · evidências · apresentação</text></g>
