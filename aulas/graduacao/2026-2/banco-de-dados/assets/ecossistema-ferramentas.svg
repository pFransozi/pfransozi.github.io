<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="760" viewBox="0 0 1600 760" role="img" aria-labelledby="title desc">
<title id="title">Ecossistema de ferramentas de Banco de Dados</title><desc id="desc">Fluxo da modelagem ao versionamento usando diagrams.net, Colab, SQLite, PostgreSQL, psql, pgAdmin, Python, Psycopg, Visual Studio Code, Git e GitHub.</desc>
<defs><linearGradient id="bg2" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f4f7ff"/><stop offset="1" stop-color="#eefaf8"/></linearGradient><filter id="s"><feDropShadow dx="0" dy="12" stdDeviation="12" flood-color="#1b2a48" flood-opacity=".12"/></filter><marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#8494b4"/></marker></defs>
