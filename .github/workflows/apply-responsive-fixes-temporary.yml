name: Aplicar ajustes responsivos temporários

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Obter repositório
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Aplicar ajustes do portal
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          def replace_once(path_text, old, new):
              path = Path(path_text)
              text = path.read_text(encoding="utf-8")
              if new in text and old not in text:
                  return
              count = text.count(old)
              if count != 1:
                  raise SystemExit(
                      f"Esperava uma ocorrência de {old!r} em {path}, encontrei {count}."
                  )
              path.write_text(text.replace(old, new, 1), encoding="utf-8")

          replace_once(
              "_includes/header.liquid",
              'navbar navbar-light navbar-expand-sm ',
              'navbar navbar-light navbar-expand-lg ',
          )

          replace_once(
              "_includes/education_cards_styles.liquid",
              "  .course-card-meta {\n    display: flex;\n    justify-content: space-between;\n    gap: 0.75rem;\n  }",
              "  .course-card-meta {\n    display: flex;\n    flex-wrap: wrap;\n    justify-content: space-between;\n    gap: 0.45rem 0.75rem;\n  }",
          )

          portal_pages = [
              "_pages/inteligencia-artificial-aplicada.md",
              "_pages/banco-de-dados.md",
              "_pages/arquitetura-computadores-sistemas-operacionais.md",
          ]

          for portal in portal_pages:
              replace_once(
                  portal,
                  "grid-template-columns: 56px minmax(0, 1fr) 330px;",
                  "grid-template-columns: 56px minmax(0, 1fr) minmax(220px, 330px);",
              )
              replace_once(
                  portal,
                  "width: 330px; min-width: 330px; max-width: 330px; gap: .45rem; white-space: nowrap;",
                  "width: 100%; min-width: 0; max-width: 330px; gap: .45rem; white-space: normal; overflow-wrap: anywhere;",
              )
              replace_once(
                  portal,
                  "@media (max-width: 700px) { .lesson-item",
                  "@media (max-width: 860px) { .lesson-item",
              )
          PY

      - name: Validar e publicar
        run: |
          set -euo pipefail
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- \
            _includes/header.liquid \
            _includes/education_cards_styles.liquid \
            _pages/inteligencia-artificial-aplicada.md \
            _pages/banco-de-dados.md \
            _pages/arquitetura-computadores-sistemas-operacionais.md
          git rm -- .github/workflows/apply-responsive-fixes-temporary.yml
          git commit -m "fix: melhora responsividade do cabeçalho e dos portais"
          git push origin HEAD:main
          git push origin --delete chore/responsividade-geral-20260820 || true
