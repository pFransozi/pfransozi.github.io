name: Format laboratory branch

on:
  push:
    branches:
      - feature/laboratorio-blocos-trilha-8ano

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: feature/laboratorio-blocos-trilha-8ano

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install formatter
        run: npm install --save-dev --save-exact prettier @shopify/prettier-plugin-liquid

      - name: Format laboratory files
        run: |
          npx prettier --write \
            aulas/ensino-fundamental/laboratorio-blocos-dados.js \
            aulas/ensino-fundamental/laboratorio-blocos.css \
            aulas/ensino-fundamental/laboratorio-blocos.js
          node --check aulas/ensino-fundamental/laboratorio-blocos-dados.js
          node --check aulas/ensino-fundamental/laboratorio-blocos.js

      - name: Commit formatter output
        run: |
          if git diff --quiet -- \
            aulas/ensino-fundamental/laboratorio-blocos-dados.js \
            aulas/ensino-fundamental/laboratorio-blocos.css \
            aulas/ensino-fundamental/laboratorio-blocos.js; then
            echo "No formatting changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- \
            aulas/ensino-fundamental/laboratorio-blocos-dados.js \
            aulas/ensino-fundamental/laboratorio-blocos.css \
            aulas/ensino-fundamental/laboratorio-blocos.js
          git commit -m "style: format laboratory files"
          git push origin HEAD:feature/laboratorio-blocos-trilha-8ano
