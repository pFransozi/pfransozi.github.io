title: Inteligência Artificial Aplicada
short_title: IA Aplicada
program: Engenharia de Software
institution: UniSENAI
semester: 2026/2
description: >-
  Disciplina voltada aos fundamentos e aplicações de Inteligência Artificial,
  articulando conceitos clássicos, resolução de problemas, aprendizado de
  máquina e análise crítica de sistemas contemporâneos de IA.

lessons:
  - number: 1
    title: Apresentação da disciplina
    description: >-
      Visão geral do semestre, metodologia, avaliações, trabalho geral,
      calendários das turmas e protocolo IA-First.
    status: published
    url: https://pfransozi.github.io/ia-aplicada-2026-02/curso.html
    action_label: Acessar apresentação

  - number: 2
    title: Fundamentos e evolução da Inteligência Artificial
    description: >-
      Distinguir inteligência artificial, automação convencional e sistemas
      baseados em regras; reconhecer aplicações, limites e critérios iniciais
      para identificar problemas adequados ao uso de IA.
    content: >-
      Fundamentos e evolução da IA; agentes e sistemas inteligentes; tipos de
      problemas; aplicações contemporâneas; limites técnicos, riscos e
      introdução ao uso crítico de IA generativa.
    status: published
    url: https://pfransozi.github.io/ia-aplicada-2026-02/aula-02.html
    action_label: Acessar aula
    resources:
      - label: Material de aprofundamento
        url: https://pfransozi.github.io/ia-aplicada-2026-02/aula-02-aprofundamento.html
      - label: Áudio complementar
        url: https://pfransozi.github.io/ia-aplicada-2026-02/aula-02-determinismo-sistemas-probabilisticos-ia-compacto.ogg

  - number: 3
    title: Formulação de problemas e espaço de estados
    description: >-
      Formular problemas de IA transformando situações do mundo real em
      representações computacionais com estados, ações, objetivos, entradas,
      saídas, restrições e critérios de sucesso.
    content: >-
      Formulação de problemas; abstração; espaço de estados; definição de
      objetivo; restrições; critérios de sucesso e avaliação; representação
      computacional em Python.
    status: published
    url: https://pfransozi.github.io/ia-aplicada-2026-02/aula-03.html
    action_label: Acessar aula

  - number: 4
    title: "Busca não informada: BFS e DFS"
    description: >-
      Aplicar busca em largura e busca em profundidade em espaços de estados,
      compreendendo fronteira, expansão, estados visitados e os efeitos da
      estratégia de exploração.
    content: >-
      Problemas e espaços de busca; fronteira; expansão de estados; busca em
      largura (BFS); busca em profundidade (DFS); filas e pilhas; controle de
      estados visitados; comparação experimental e implementação em Python.
    status: published
    url: https://pfransozi.github.io/ia-aplicada-2026-02/aula-04.html
    action_label: Acessar aula
